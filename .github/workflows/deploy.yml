name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exigir package-lock.json
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json não encontrado. Rode 'npm install' localmente e faça commit do arquivo."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Definir caminho-base do Vite
        env:
          BASE_OVERRIDE: ${{ vars.VITE_BASE_PATH }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "$BASE_OVERRIDE" ]; then
            BASE="$BASE_OVERRIDE"
          elif [[ "$REPO" == *.github.io ]]; then
            BASE="/"
          else
            BASE="/$REPO/"
          fi
          echo "VITE_BASE_PATH=$BASE" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
